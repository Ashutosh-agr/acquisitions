version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: jsprac-dev
    env_file:
      - .env.dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acquisitions-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: node-app-dev
    ports:
      - '3000:3000'
    env_file:
      - .env.dev
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acquisitions-dev
    restart: unless-stopped

networks:
  acquisitions-dev:
    driver: bridge

volumes:
  pgdata:
