apiVersion: apps/v1
kind: Deployment
metadata:
  name: acquisition-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: acquisitions
  template:
    metadata:
      labels:
        app: acquisitions
    spec:
      containers:
        - name: acquisitions
          image: ashu003/acquisitions:latest
          ports:
            - containerPort: 3000
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: acquisitions-secrets
                  key: DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: acquisitions-secrets
                  key: JWT_SECRET
          resources:
            limits:
              memory: '512Mi'
              cpu: '500m'
            requests:
              memory: '256Mi'
              cpu: '250m'

